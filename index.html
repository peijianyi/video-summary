<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频链接</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #fff; margin-bottom: 30px; font-size: 1.8rem; }
    .input-group { margin-bottom: 20px; }
    input[type="url"] {
      width: 100%;
      padding: 15px 20px;
      font-size: 16px;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      outline: none;
      transition: 0.3s;
    }
    input[type="url"]::placeholder { color: rgba(255,255,255,0.5); }
    input[type="url"]:focus { background: rgba(255,255,255,0.25); }
    button {
      width: 100%;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #00d4ff, #7c3aed);
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,212,255,0.3); }
    .tips { color: rgba(255,255,255,0.6); margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 视频链接</h1>
    <div class="input-group">
      <input type="url" id="videoUrl" placeholder="粘贴视频链接..." />
    </div>
    <button onclick="copyLink()">复制链接</button>
    <p class="tips">支持 YouTube、B站、抖音等</p>
  </div>
  <script>
    function copyLink() {
      const url = document.getElementById('videoUrl').value.trim();
      if (!url) { alert('请输入视频链接'); return; }
      navigator.clipboard.writeText(url).then(() => {
        alert('链接已复制！');
      });
    }
  </script>
</body>
</html>
